<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>popup BEFORE (main)</title>
<link href="MudBlazor.min.css" rel="stylesheet" />
<link href="YBApparel.css" rel="stylesheet" />
<link href="BellPhotoPopup_before.css" rel="stylesheet" />
<style>
 body { margin: 0; background: #eee; font-family: system-ui; }
 .mud-dialog { margin: 24px auto; max-width: 1100px; background: #fff; }
 #tag { position: fixed; top: 4px; right: 8px; font: 700 14px system-ui; color: #c00; z-index: 99; }
</style></head><body>
<div id="tag">BEFORE (main)</div>
<div class="mud-dialog store-product-dialog store-dialog store-product-dialog--expanded">
 <div class="mud-dialog-content">
  <div class="store-modal-content">
   <div class="mud-paper mud-elevation-0 store-product-card store-card">
    <div class="mud-grid mud-grid-spacing-xs-3 store-product-grid">
     <div class="mud-grid-item mud-grid-item-xs-12 store-preview-column">
      <div class="store-preview-frame">
       <span class="store-preview-label">Preview</span>
       <div class="store-main-image-shell">
        <div class="store-layered-preview is-loaded">
         <img src="fg.png" alt="" aria-hidden="true" class="store-product-image store-preview-size-reference" />
         <img src="bg.jpg" alt="bg" class="store-preview-background" />
         <img src="fg.png" alt="student" class="store-preview-foreground" />
        </div>
       </div>
      </div>
     </div>
     <div class="mud-grid-item mud-grid-item-xs-12 store-options-column">
      <div style="height:420px;background:#f4f6fb;border:1px solid #ccd">options column</div>
     </div>
    </div>
   </div>
  </div>
 </div>
</div>
<script>
 window.measure = () => {
   const r = el => { const b = document.querySelector(el).getBoundingClientRect();
     return {x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height)}; };
   return {
     viewport: [innerWidth, innerHeight],
     frame: r('.store-preview-frame'),
     shell: r('.store-main-image-shell'),
     layered: r('.store-layered-preview'),
     sizingRef: r('.store-preview-size-reference'),
     background: r('.store-preview-background'),
     foreground: r('.store-preview-foreground'),
   };
 };
</script>
</body></html>
